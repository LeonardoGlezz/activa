# Render Blueprint: Render lee este archivo al crear el servicio
# (New → Blueprint). Las variables con sync: false las pide al crearlo.
services:
  - type: web
    name: activa
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Base MySQL gratuita (TiDB Cloud Starter)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        value: "true"
      # Archivos subidos: se guardan en la misma base (sin servicios extra ni tarjeta).
      # Para usar Cloudflare R2 en su lugar, agrega S3_ENDPOINT, S3_BUCKET,
      # S3_ACCESS_KEY_ID y S3_SECRET_ACCESS_KEY en Render.
      - key: UPLOADS_IN_DB
        value: "true"
